[workspace]
members = [
    "crates/ld-schemas",
    "crates/ld-models",
    "crates/ld-context",
    "crates/ld-policy",
    "crates/ld-sandbox",
    "crates/ld-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
walkdir = "2"
ignore = "0.4"
regex = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
similar = "2"

# Internal crate dependencies
ld-schemas = { path = "crates/ld-schemas" }
ld-models = { path = "crates/ld-models" }
ld-context = { path = "crates/ld-context" }
ld-policy = { path = "crates/ld-policy" }
ld-sandbox = { path = "crates/ld-sandbox" }

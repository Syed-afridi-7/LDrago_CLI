[package]
name = "ld-cli"
version = "0.1.0"
edition = "2021"
description = "High-performance CLI orchestrator for LDrago AI Platform"

[lib]
name = "ld_cli"
path = "src/lib.rs"

[[bin]]
name = "ldrago"
path = "src/main.rs"

[dependencies]
ld-schemas = { workspace = true }
ld-models = { workspace = true }
ld-context = { workspace = true }
ld-policy = { workspace = true }
ld-sandbox = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }

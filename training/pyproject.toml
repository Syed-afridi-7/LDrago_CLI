[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldrago-training"
version = "0.1.0"
description = "LDrago CLI neural models, tokenizers, and training harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizer", "src/models"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
